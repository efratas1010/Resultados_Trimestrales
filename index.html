<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plataforma de Portafolio Estratégico</title>
<!-- Tipografías (con fallback a fuentes del sistema si no hay conexión) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- Librerías permitidas (cdnjs) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<!-- Estilos (orden importa) -->
<link rel="stylesheet" href="css/01-base.css">
<link rel="stylesheet" href="css/02-layout.css">
<link rel="stylesheet" href="css/03-componentes.css">
<link rel="stylesheet" href="css/04-plataforma.css">
<link rel="stylesheet" href="css/05-responsivo.css">
<link rel="stylesheet" href="css/06-impresion.css">
</head>
<body>
<a class="skip" href="#content">Saltar al contenido</a>
<div id="login" class="login" hidden></div>
<div class="app" id="app" hidden>
  <!-- ===== Barra lateral ===== -->
  <aside class="sidebar" id="sidebar" hidden>
    <nav id="nav"></nav><span id="areaTitle"></span><span id="globalPct"></span><div id="areaList"></div>
  </aside>

  <!-- ===== Contenido ===== -->
     <header class="topbar tb">
      <div class="tb-left">
        <button type="button" class="icon-btn menu-btn" data-action="menu" aria-label="Abrir menú" id="menuBtn" hidden></button>
        <button type="button" class="btn sm" data-action="nav" data-view="inicio" id="homeBtn" hidden></button>
        <div><h1 id="viewTitle">Inicio</h1><p id="viewSub"></p></div>
      </div>
      <div class="tb-center"><strong id="brandName">Portafolio Estratégico</strong><span id="brandSub"></span></div>
      <div class="tb-right">
        <div class="save-status" id="saveStatus" role="status" aria-live="polite"><span class="dot"></span><span class="txt">Guardado</span></div>
        <button type="button" class="icon-btn" data-action="theme" id="themeBtn"></button>
        <div class="user-chip" id="userChip"></div>
      </div>
      <div class="top-actions" id="topActions"></div>
    </header>
    <main class="content" id="content" tabindex="-1">
      <section id="view-registro" hidden></section>
      <section id="view-presentacion" hidden></section>
      <section id="view-inicio" hidden></section>
      <section id="view-admin" hidden></section>
    </main>
</div>

<input type="file" id="fileInput" accept=".xlsx,.xls" hidden>
<div id="modalRoot"></div>
<div class="slides" id="slides" hidden role="dialog" aria-modal="true" aria-label="Modo presentación"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="printArea"></div>

<!-- Scripts (orden importa: config → utilidades → ... → inicio) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/00-supabase-config.js"></script>
<script src="js/01-config.js"></script>
<script src="js/02-utilidades.js"></script>
<script src="js/03-almacenamiento.js"></script>
<script src="js/04-calculos.js"></script>
<script src="js/05-datos-ejemplo.js"></script>
<script src="js/06-navegacion.js"></script>
<script src="js/07-edicion.js"></script>
<script src="js/08-filtros.js"></script>
<script src="js/09-dashboard.js"></script>
<script src="js/10-presentacion.js"></script>
<script src="js/11-impresion.js"></script>
<script src="js/12-excel.js"></script>
<script src="js/13-configuracion.js"></script>
<script src="js/14-usuarios-sesion.js"></script>
<script src="js/15-eventos.js"></script>
<script src="js/17-supabase-adaptador.js"></script>
<script src="js/16-inicio.js"></script>
</body>
</html>
